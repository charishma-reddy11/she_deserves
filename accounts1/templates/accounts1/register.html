{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600&display=swap');

    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow-x: hidden;
    }

    .hero-section {
        min-height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 40px 8%;
        box-sizing: border-box;
        
      
        background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), 
                    url("{% static 'images/main back_ground.avif' %}");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
    }

    
    .glass-card {
        background: rgba(255, 255, 255, 0.15); 
        backdrop-filter: blur(15px); 
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 30px;
        width: 100%;
        max-width: 500px;
        padding: 40px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        color: #fff;
        animation: slideUp 0.8s ease-out;
    }

    .brand-area {
        text-align: center;
        margin-bottom: 30px;
    }

    .brand-area h1 {
        font-family: 'Playfair Display', serif;
        font-size: 3rem;
        margin: 0;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    }

    .quote-style {
        font-family: 'Playfair Display', serif;
        font-style: italic;
        color: #f1c40f;
        font-size: 1.1rem;
        margin-top: 10px;
        min-height: 50px; 
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .full { grid-column: span 2; }

    input, textarea {
        width: 100%;
        padding: 12px 18px;
        background: rgba(255, 255, 255, 0.95);
        border: none;
        border-radius: 12px;
        font-size: 0.95rem;
        color: #333;
        box-sizing: border-box;
        transition: 0.3s;
    }

    input:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(241, 196, 15, 0.5);
    }

    .submit-btn {
        width: 100%;
        padding: 15px;
        background: #2c3e50;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        margin-top: 20px;
        transition: 0.4s;
    }

    .submit-btn:hover {
        background: #000;
        transform: translateY(-3px);
    }

    .footer-text {
        text-align: center;
        margin-top: 20px;
        font-size: 0.9rem;
    }

    .footer-text a {
        color: #f1c40f;
        text-decoration: none;
        font-weight: bold;
    }

    @keyframes slideUp {
        from { transform: translateY(30px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 768px) {
        .hero-section { justify-content: center; padding: 20px; }
        .form-grid { grid-template-columns: 1fr; }
        .full { grid-column: span 1; }
    }
</style>

<div class="hero-section">
    <div class="glass-card">
        <div class="brand-area">
            <h1>She Deserves</h1>
            <p class="quote-style" id="quote-display">She deserves to see the sunset from a different shore.</p>
        </div>

        <form method="post" id="registrationForm">
            {% csrf_token %}
            <input type="hidden" name="username" id="id_username">

            <div class="form-grid">
                <div><input type="text" name="first_name" placeholder="First Name" required></div>
                <div><input type="text" name="last_name" placeholder="Last Name" required></div>
                
                <div class="full"><input type="email" name="email" id="email_input" placeholder="Email Address" required></div>
                
                <div class="full"><input type="text" name="phone_number" placeholder="WhatsApp Number" required></div>
                
                <div class="full"><textarea name="address" rows="1" placeholder="Address / City" required></textarea></div>
                
                <div><input type="password" name="password1" placeholder="Password" required></div>
                <div><input type="password" name="password2" placeholder="Confirm Password" required></div>
            </div>

            <button type="submit" class="submit-btn">Join the Journey</button>
            
            <div class="footer-text">
                Already a member? <a href="{% url 'accounts1:login' %}">Login here</a>
            </div>
        </form>
    </div>
</div>

<script>
   
    const travelQuotes = [
        "She deserves to see the sunset from a different shore.",
        "Whatever she wants, she deserves to explore.",
        "The world is a book, she deserves to read every page.",
        "Adventure is calling, and she deserves to go.",
        "To travel is to live, and she deserves to live fully."
    ];

    let count = 0;
    function rotateQuote() {
        const qElement = document.getElementById('quote-display');
        qElement.style.opacity = 0;
        setTimeout(() => {
            count = (count + 1) % travelQuotes.length;
            qElement.innerText = travelQuotes[count];
            qElement.style.opacity = 1;
        }, 500);
    }
    setInterval(rotateQuote, 4000);

    document.getElementById('registrationForm').onsubmit = function() {
        document.getElementById('id_username').value = document.getElementById('email_input').value;
    };
</script>
{% endblock %}
