{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}She Deserves{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="{% static 'images/Gemini_Generated_Image_pdkh9pdkh9pdkh9p.png' %}">

    <style>
        :root {
            --beauty-gold: #d4af37;
            --deep-charcoal: #2d2d2d;
            --soft-nude: #fffaf9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--soft-nude);
            color: var(--deep-charcoal);
        }

        .navbar {
            background: #fff !important;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding: 0.8rem 0;
        }

        .navbar-brand span {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--deep-charcoal);
        }

        .header-logo {
            height: 45px;
            width: auto;
            border-radius: 50%;
        }

        .nav-link {
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--deep-charcoal) !important;
            margin: 0 10px;
        }

        .nav-link:hover {
            color: var(--beauty-gold) !important;
        }

        .btn-register {
            border: 1.5px solid var(--deep-charcoal);
            padding: 6px 20px !important;
            transition: all 0.3s;
        }

        .btn-register:hover {
            background: var(--deep-charcoal);
            color: #fff !important;
        }

        .auth-status {
            font-size: 0.8rem;
            color: #777;
            margin-right: 15px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="{% static 'images/Gemini_Generated_Image_pdkh9pdkh9pdkh9p.png' %}" 
                     alt="Logo" class="header-logo me-2">
                <span>SHE DESERVES</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto align-items-center">
                    {% if user.is_authenticated %}
                        <span class="auth-status d-none d-lg-inline">
                            <i class="bi bi-person-circle"></i> {{ user.email }}
                        </span>
                        <a class="nav-link" href="{% url 'accounts1:logout' %}">Logout</a>
                    {% else %}
                        <a class="nav-link" href="{% url 'accounts1:login' %}">Login</a>
                        <a class="nav-link btn-register" href="{% url 'accounts1:register' %}">Register</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="container mt-5">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
