{% extends 'travel/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm border-0 p-4" style="border-radius: 15px; max-width: 800px; margin: auto;">
        <h2 class="fw-bold mb-4">
            <i class="fas fa-user-cog me-2 text-primary"></i>Profile Settings
        </h2>
        <hr>
        <div class="row">
            <div class="col-md-4 text-center border-end mb-4 mb-md-0">
                <div class="mb-3">
                    <i class="fas fa-user-circle fa-5x text-secondary"></i>
                </div>
                <h5>{{ user.first_name|default:"Traveler" }}</h5>
                <p class="text-muted small">She Deserves Member</p>
            </div>
            
            <div class="col-md-8 px-4">
                <form method="POST" action="{% url 'travel:settings_view' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Display Name</label>
                        <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" class="form-control bg-light" value="{{ user.email }}" readonly>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Safety Contact Number</label>
                        <input type="text" name="phone_number" class="form-control" value="{{ user.phone_number }}" placeholder="Emergency contact">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Address</label>
                        <textarea name="address" class="form-control" rows="2">{{ user.address }}</textarea>
                    </div>
                    
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary rounded-pill">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
